<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缤纷圣代 — 项目</title>
<meta name="description" content="缤纷圣代（Sundae）的软件项目列表。目前有 Cherimoya SSH：基于 Tauri v2 与 Rust 构建的跨平台桌面 SSH 客户端，支持 Windows 与 macOS，MIT 开源。">
<meta name="theme-color" content="#F4F8F3">
<meta property="og:title" content="缤纷圣代 — 项目">
<meta property="og:description" content="Cherimoya SSH：基于 Tauri v2 与 Rust 构建的跨平台桌面 SSH 客户端。">
<meta property="og:image" content="assets/cherimoya.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/cherimoya.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   缤纷圣代 — 项目陈列页
   配色、字体、贴纸质感与 cherimoya-ssh.html 产品页共用一套
   ============================================================ */

:root{
  /* 表面 */
  --paper:      #F4F8F3;
  --paper-2:    #FFFFFF;

  /* 墨色（深紫，非纯黑，降低对比刺激） */
  --ink:        #2A1B4D;
  --ink-2:      #6B5C8C;
  --ink-3:      #9C90B5;

  /* 品牌 */
  --mint:       #2FBFAE;
  --mint-deep:  #1F9C8D;
  --mint-soft:  #D9F4EF;
  --lime:       #C9E23C;
  --lime-soft:  #F0F7C9;
  --lilac:      #E8DFFB;

  --line:       #E1E9DE;

  --f-display: 'Zen Maru Gothic', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-body:    'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --f-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --wrap: 1140px;

  --r-lg: 26px;
  --r-md: 18px;
  --r-pill: 999px;
}

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:var(--f-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }

::selection{ background:var(--lime); color:var(--ink); }

:focus-visible{
  outline:3px solid var(--mint-deep);
  outline-offset:3px;
  border-radius:6px;
}

.wrap{
  width:100%;
  max-width:var(--wrap);
  margin:0 auto;
  padding:0 24px;
}

/* ---------- 背景光斑（氛围，非装饰主体） ---------- */
.orbs{
  position:fixed; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
}
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
.orb-a{ width:520px; height:520px; background:var(--mint-soft); top:-180px; right:-120px; }
.orb-b{ width:420px; height:420px; background:var(--lilac); top:38%; left:-200px; opacity:.42; }
.orb-c{ width:460px; height:460px; background:var(--lime-soft); bottom:-160px; right:6%; opacity:.5; }

/* ============================================================
   导航 —— 与产品页同一形态
   ============================================================ */
.nav-wrap{
  position:sticky; top:0; z-index:50;
  padding:16px 0;
}
.nav{
  display:flex; align-items:center; gap:14px;
  max-width:var(--wrap);
  margin:0 auto;
  padding:9px 10px 9px 16px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:2px solid var(--ink);
  border-radius:var(--r-pill);
  box-shadow:5px 5px 0 var(--mint-soft);
}
.brand{ display:flex; align-items:center; gap:9px; flex-shrink:0; }

/* 站点标记用终端提示符，产品 logo 留给项目卡片自己用 */
.brand-mark{
  display:grid; place-items:center;
  width:30px; height:30px;
  border-radius:10px;
  background:var(--mint-soft);
  border:2px solid var(--ink);
  font-family:var(--f-mono); font-weight:600; font-size:13px;
  line-height:1; color:var(--mint-deep);
}
.brand-name{
  font-family:var(--f-display);
  font-weight:900; font-size:15px; letter-spacing:-.01em;
  white-space:nowrap;
}

.tabs{
  display:flex; align-items:center; gap:4px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }

.tab{
  position:relative;
  display:flex; align-items:center; gap:7px;
  padding:8px 17px;
  border-radius:var(--r-pill);
  font-size:14px; font-weight:500; color:var(--ink-2);
  white-space:nowrap;
  transition:background .18s ease, color .18s ease;
}
.tab::before{
  content:'';
  width:6px; height:6px; border-radius:50%;
  background:var(--mint);
  transform:scale(0);
  transition:transform .22s cubic-bezier(.2,.8,.3,1);
}
.tab:hover{ background:var(--mint-soft); color:var(--ink); }
.tab.is-active{ background:var(--mint); color:#fff; font-weight:700; }
.tab.is-active::before{ transform:scale(1); background:var(--lime); }

/* ============================================================
   首屏 —— 提示符 + 目录名
   ============================================================ */
.hero{
  position:relative; z-index:1;
  padding:clamp(44px,6.5vw,82px) 0 clamp(36px,4.5vw,54px);
}

.shell-pill{
  display:inline-flex; align-items:center; gap:2px;
  padding:9px 18px;
  background:var(--paper-2);
  border:2px solid var(--ink);
  border-radius:var(--r-pill);
  box-shadow:4px 4px 0 var(--mint-soft);
  font-family:var(--f-mono);
  font-size:13px;
  line-height:1;
  letter-spacing:.01em;
}
.shell-user{ color:var(--mint-deep); font-weight:600; }
.shell-path{ color:var(--ink-3); }
.shell-pmt{ color:var(--mint-deep); font-weight:600; margin-left:6px; }

/* 光标复用产品页的方块，颜色改成墨色以适配浅底 */
.cursor{
  display:inline-block;
  width:7px; height:14px;
  margin-left:5px;
  background:var(--mint-deep);
  vertical-align:-2px;
  animation:blink 1.1s step-end infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.hero-title{
  font-family:var(--f-display);
  font-weight:900;
  font-size:clamp(3rem,9vw,6rem);
  line-height:.95;
  letter-spacing:-.045em;
  margin-top:24px;
}

.hero-lead{
  max-width:34em;
  margin-top:20px;
  font-size:clamp(1rem,1.5vw,1.08rem);
  color:var(--ink-2);
  line-height:1.85;
}

/* ============================================================
   项目列表 —— 书架：每条左边一道彩色书脊
   ============================================================ */
.projects{
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  gap:20px;
  padding-bottom:clamp(40px,5vw,60px);
}

.project{
  position:relative;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:clamp(18px,2.6vw,30px);
  align-items:center;
  padding:clamp(22px,3vw,30px) clamp(24px,3.4vw,34px);
  padding-left:calc(clamp(24px,3.4vw,34px) + 8px);
  background:var(--paper-2);
  border:2px solid var(--ink);
  border-radius:var(--r-lg);
  box-shadow:6px 6px 0 var(--mint-soft);
  overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease;
}
/* 书脊：每个项目一道自己的颜色，--spine 由项目自己给 */
.project::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0;
  width:7px;
  background:var(--spine, var(--mint));
  transition:width .22s cubic-bezier(.2,.8,.3,1);
}
.project:hover,
.project:focus-visible{
  transform:translate(-3px,-3px);
  box-shadow:10px 10px 0 var(--spine, var(--mint));
}
.project:hover::before,
.project:focus-visible::before{ width:13px; }

.project-mark{
  display:grid; place-items:center;
  width:clamp(66px,9vw,86px);
  height:clamp(66px,9vw,86px);
  padding:9px;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:22px;
  box-shadow:3px 3px 0 var(--mint-soft);
  transition:transform .24s cubic-bezier(.2,.8,.3,1);
}
.project:hover .project-mark{ transform:rotate(-4deg) scale(1.04); }
.project-mark img{ width:100%; height:100%; object-fit:contain; }

.project-body{ min-width:0; }

.project-name{
  font-family:var(--f-display);
  font-weight:900;
  font-size:clamp(1.2rem,2.2vw,1.55rem);
  line-height:1.25;
  letter-spacing:-.02em;
}

.project-desc{
  max-width:44em;
  margin-top:8px;
  font-size:.94rem;
  color:var(--ink-2);
  line-height:1.72;
}

.project-tags{
  display:flex; flex-wrap:wrap; gap:7px;
  margin-top:15px;
}
.tag{
  padding:4px 11px;
  border-radius:var(--r-pill);
  background:var(--mint-soft);
  color:var(--mint-deep);
  font-family:var(--f-mono);
  font-size:11.5px; font-weight:600;
  line-height:1.5;
  letter-spacing:.02em;
}

.project-meta{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  margin-top:12px;
  font-family:var(--f-mono);
  font-size:12px;
  color:var(--ink-3);
}
.project-meta .sep{ color:var(--line); }

.project-go{
  display:grid; place-items:center;
  width:48px; height:48px;
  flex-shrink:0;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:50%;
  box-shadow:3px 3px 0 var(--lilac);
  transition:transform .24s cubic-bezier(.2,.8,.3,1), background .24s ease, box-shadow .24s ease;
}
.project-go svg{
  width:19px; height:19px;
  fill:none; stroke:var(--ink); stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round;
  transition:stroke .24s ease;
}
.project:hover .project-go,
.project:focus-visible .project-go{
  background:var(--mint);
  box-shadow:3px 3px 0 var(--ink);
  transform:translateX(5px);
}
.project:hover .project-go svg,
.project:focus-visible .project-go svg{ stroke:#fff; }

/* 列表结束后的空提示符：目录念完了，shell 还等着 */
.shelf-tail{
  position:relative; z-index:1;
  display:flex; align-items:center;
  padding-bottom:clamp(56px,8vw,92px);
  font-family:var(--f-mono);
  font-size:13px;
  color:var(--ink-3);
}
.shelf-tail .shell-user{ opacity:.75; }

/* ---------- 页脚 ---------- */
.foot{
  position:relative; z-index:1;
  border-top:2px solid var(--ink);
  padding:34px 0;
  background:var(--paper-2);
}
.foot-inner{
  display:flex; flex-wrap:wrap; align-items:center; gap:16px;
  justify-content:space-between;
  font-size:.85rem; color:var(--ink-3);
}
.foot-brand{ display:flex; align-items:center; gap:9px; }
.foot-brand .brand-mark{
  width:24px; height:24px;
  border-radius:8px;
  font-size:11px;
}
.foot-brand b{
  font-family:var(--f-display);
  font-weight:700; color:var(--ink); font-size:.95rem;
}
.foot-links{ display:flex; flex-wrap:wrap; gap:20px; }
.foot-links a:hover{ color:var(--mint-deep); }

/* ============================================================
   入场动效
   ============================================================ */
.rv{ opacity:0; transform:translateY(20px); }
.rv.is-in{
  opacity:1; transform:none;
  transition:opacity .6s ease, transform .65s cubic-bezier(.2,.8,.3,1);
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:640px){
  .nav{ padding:8px; gap:8px; }
  .brand-name{ display:none; }
  .tab{ padding:8px 13px; font-size:13px; }

  /* 图标与箭头并排一行，正文整幅铺到下面 */
  .project{ grid-template-columns:auto minmax(0,1fr); align-items:center; }
  .project-mark{
    width:60px; height:60px;
    padding:7px;
    border-radius:17px;
  }
  .project-go{
    grid-column:2; grid-row:1;
    justify-self:end;
    width:40px; height:40px;
  }
  .project-body{
    grid-column:1 / -1;
    margin-top:18px;
  }

  .foot-inner{ flex-direction:column; align-items:flex-start; gap:12px; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .rv{ opacity:1; transform:none; }
}
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<header class="nav-wrap">
  <nav class="nav" aria-label="站点导航">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">❯</span>
      <span class="brand-name">缤纷圣代</span>
    </a>
    <div class="tabs">
      <a class="tab is-active" href="index.html" aria-current="page">项目</a>
      <a class="tab" href="https://github.com/binfenshengdai" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>
</header>

<main>

  <!-- ================= 首屏 ================= -->
  <section class="hero">
    <div class="wrap">
      <p class="shell-pill rv">
        <span class="shell-user">sundae@workshop</span><span class="shell-path">:~</span><span class="shell-pmt">$</span>
        <span class="cursor" aria-hidden="true"></span>
      </p>

      <h1 class="hero-title rv">projects/</h1>

      <p class="hero-lead rv">我做的东西都放在这里。点开一个，看它在做什么。</p>
    </div>
  </section>

  <!-- ================= 项目列表 ================= -->
  <section class="wrap" aria-label="项目列表">
    <ul class="projects">

      <li class="rv">
        <a class="project" href="cherimoya-ssh.html" style="--spine:var(--mint)">
          <span class="project-mark">
            <img src="assets/cherimoya.png" width="86" height="86" alt="Cherimoya SSH 图标：一颗青绿色的释迦果">
          </span>

          <span class="project-body">
            <span class="project-name">Cherimoya SSH</span>
            <span class="project-desc">
              基于 Tauri v2 与 Rust 写的桌面 SSH 客户端。多标签终端、SFTP 文件管理、
              拖拽上传，都在同一个窗口里完成。
            </span>
            <span class="project-tags">
              <span class="tag">Tauri v2</span>
              <span class="tag">Rust</span>
              <span class="tag">Vue 3</span>
              <span class="tag">xterm.js</span>
            </span>
            <span class="project-meta">
              <span data-cherimoya-version>v1.0.6</span>
              <span class="sep">/</span>
              <span>Windows · macOS</span>
              <span class="sep">/</span>
              <span>MIT 开源</span>
            </span>
          </span>

          <span class="project-go" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12.5 6 6 6-6 6"/></svg>
          </span>
        </a>
      </li>

    </ul>

    <p class="shelf-tail" aria-hidden="true">
      <span class="shell-user">sundae@workshop</span><span class="shell-path">:~$</span>
      <span class="cursor"></span>
    </p>
  </section>

</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <div class="foot-brand">
      <span class="brand-mark" aria-hidden="true">❯</span>
      <b>缤纷圣代</b>
      <span>Projects</span>
    </div>
    <div class="foot-links">
      <a href="https://github.com/binfenshengdai" target="_blank" rel="noopener">GitHub</a>
    </div>
    <span>Made with ❤️ by Sundae</span>
  </div>
</footer>

<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = Array.prototype.slice.call(document.querySelectorAll('.rv'));

  if (reduce || !('IntersectionObserver' in window)) {
    items.forEach(function (el) { el.classList.add('is-in'); });
    return;
  }

  var reveal = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var el = entry.target;
      // 同组元素错开出场，读起来像输出逐行落下
      var sibs = Array.prototype.filter.call(el.parentNode.children, function (n) {
        return n.classList && n.classList.contains('rv');
      });
      el.style.transitionDelay = Math.min(sibs.indexOf(el), 6) * 70 + 'ms';
      el.classList.add('is-in');
      reveal.unobserve(el);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });

  items.forEach(function (el) { reveal.observe(el); });
})();
</script>
<script src="assets/version.js" defer></script>
</body>
